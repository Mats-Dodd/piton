[profile.default]
retries = 0
fail-fast = false
slow-timeout = { period = "20s", terminate-after = 3 }
leak-timeout = "500ms"

[profile.ci]
fail-fast = true
final-status-level = "flaky"

# Simulations run many seeds in one test; give them room
# (PITON_SIM_SEEDS raises the count for longer runs).
[[profile.default.overrides]]
filter = "package(piton-sim)"
slow-timeout = { period = "60s", terminate-after = 30 }

[[profile.ci.overrides]]
filter = "package(piton-sim)"
slow-timeout = { period = "60s", terminate-after = 30 }
